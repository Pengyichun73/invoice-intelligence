name: invoice-intelligence

x-business-db-env: &business-db-env
  INVOICE_INTELLIGENCE_BUSINESS_DATABASE_URL: "postgresql+psycopg://${POSTGRES_BUSINESS_USER:?set POSTGRES_BUSINESS_USER}@postgres:5432/${POSTGRES_BUSINESS_DB:?set POSTGRES_BUSINESS_DB}"
  INVOICE_INTELLIGENCE_BUSINESS_DATABASE_PASSWORD_FILE: /run/secrets/postgres_business_password
  INVOICE_INTELLIGENCE_LOG_FILE_ENABLED: "${LOG_FILE_ENABLED:-true}"

services:
  transaction-analysis-worker:
    build: .
    profiles: [core]
    restart: unless-stopped
    command: ["python", "-m", "invoice_intelligence.workers.transaction_analysis"]
    env_file: [.env]
    environment: *business-db-env
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [postgres_business_password]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}

  postgres:
    image: pgvector/pgvector:pg16
    profiles: [core, mlops, object-storage]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_BUSINESS_USER:?set POSTGRES_BUSINESS_USER}
      POSTGRES_DB: ${POSTGRES_BUSINESS_DB:?set POSTGRES_BUSINESS_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_business_password
    secrets: [postgres_business_password]
    volumes: [postgres_business_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10, start_period: 15s}
    deploy: {resources: {limits: {cpus: "2.0", memory: 2G}}}
  postgres-auth:
    image: postgres:16-alpine
    profiles: [auth]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER:?set POSTGRES_AUTH_USER}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:?set POSTGRES_AUTH_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_auth_password
    secrets: [postgres_auth_password]
    volumes: [postgres_auth_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10, start_period: 15s}
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}}}
  migration:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [core, mlops, object-storage]
    restart: "no"
    command: [alembic, upgrade, head]
    env_file: [.env]
    environment: *business-db-env
    depends_on: {postgres: {condition: service_healthy}}
    secrets: [postgres_business_password]
    healthcheck: {test: [CMD-SHELL, "test -f /tmp/migration-complete || exit 0"], interval: 5s, timeout: 5s, retries: 1}
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}
  api:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [core, mlops]
    restart: unless-stopped
    command: [uvicorn, "invoice_intelligence.main:app", --host, 0.0.0.0, --port, "8000"]
    env_file: [.env]
    environment:
      <<: *business-db-env
      INVOICE_INTELLIGENCE_FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      INVOICE_INTELLIGENCE_OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://object-storage:9000}
      INVOICE_INTELLIGENCE_OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_APP_ACCESS_KEY:-${MINIO_ROOT_USER:-}}
      INVOICE_INTELLIGENCE_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/object_storage_app_secret_key
    depends_on: {postgres: {condition: service_healthy}, migration: {condition: service_completed_successfully}}
    secrets: [postgres_business_password, object_storage_app_secret_key]
    ports: ["${API_PORT:-8000}:8000"]
    volumes: [invoice_documents:/var/lib/invoice-intelligence/documents, ./logs:/app/logs]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s}
    deploy: {resources: {limits: {cpus: "2.0", memory: 2G}}}
  memory-admission:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [core, auth]
    restart: unless-stopped
    command: [python, -m, invoice_intelligence.workers.memory_admission]
    env_file: [.env]
    environment:
      <<: *business-db-env
      INVOICE_INTELLIGENCE_MEMORY_ADMISSION_WORKER_ID: "${MEMORY_ADMISSION_WORKER_ID:?set stable worker id}"
    depends_on: {postgres: {condition: service_healthy}, migration: {condition: service_completed_successfully}}
    secrets: [postgres_business_password]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}}}
  conflict-reevaluation:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [core]
    restart: unless-stopped
    command: [python, -m, invoice_intelligence.workers.conflict_reevaluation]
    env_file: [.env]
    environment: *business-db-env
    depends_on: {postgres: {condition: service_healthy}, migration: {condition: service_completed_successfully}}
    secrets: [postgres_business_password]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}
  index-rebuild:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [core]
    restart: on-failure:3
    command: [python, -m, invoice_intelligence.workers.index_rebuild]
    env_file: [.env]
    environment:
      <<: *business-db-env
      INVOICE_INTELLIGENCE_INDEX_PROJECTION_WORKER_ENABLED: "true"
      INVOICE_INTELLIGENCE_INDEX_PROJECTION_WORKER_ID: "${INDEX_PROJECTION_WORKER_ID:?set stable worker id}"
    depends_on: {postgres: {condition: service_healthy}, migration: {condition: service_completed_successfully}}
    secrets: [postgres_business_password]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health, --worker-id-env, INVOICE_INTELLIGENCE_INDEX_PROJECTION_WORKER_ID], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}}}
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.7}
    profiles: [auth]
    restart: unless-stopped
    command: [start, --http-enabled=true, --health-enabled=true]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-auth:5432/${POSTGRES_AUTH_DB:?set POSTGRES_AUTH_DB}
      KC_DB_USERNAME: ${POSTGRES_AUTH_USER:?set POSTGRES_AUTH_USER}
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_auth_password
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
    secrets: [postgres_auth_password, keycloak_admin_password]
    depends_on: {postgres-auth: {condition: service_healthy}}
    healthcheck: {test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000"], interval: 15s, timeout: 5s, retries: 10, start_period: 30s}
    deploy: {resources: {limits: {cpus: "2.0", memory: 1G}}}
  reverse-proxy:
    image: nginx:1.27-alpine
    profiles: [auth]
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}, keycloak: {condition: service_healthy}}
    ports: ["${HTTPS_PORT:-8443}:8443"]
    volumes: [./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro, ./deploy/nginx/certs:/etc/nginx/certs:ro]
    healthcheck: {test: [CMD, nginx, -t], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 256M}}}
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    profiles: [vector]
    restart: unless-stopped
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    volumes: [etcd_data:/etcd]
    healthcheck: {test: [CMD, etcdctl, endpoint, health], interval: 10s, timeout: 5s, retries: 10}
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}}}
  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [vector, mlops, object-storage]
    restart: unless-stopped
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set minio user}", MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password}
    secrets: [minio_root_password]
    command: [minio, server, /data, --console-address, ":9001"]
    volumes: [object_storage_data:/data]
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    healthcheck: {test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live], interval: 10s, timeout: 5s, retries: 10}
    deploy: {resources: {limits: {cpus: "2.0", memory: 2G}}}
  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [object-storage]
    restart: "no"
    depends_on: {object-storage: {condition: service_healthy}}
    environment:
      MINIO_ENDPOINT: http://object-storage:9000
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set minio user}"
      ORIGINALS_BUCKET: ${OBJECT_STORAGE_ORIGINALS_BUCKET:-invoice-originals}
      RENDERED_BUCKET: ${OBJECT_STORAGE_RENDERED_BUCKET:-invoice-rendered}
      DERIVED_TEXT_BUCKET: ${OBJECT_STORAGE_DERIVED_TEXT_BUCKET:-invoice-derived-text}
    secrets: [minio_root_password]
    volumes: [./deploy/minio/init-storage.sh:/init-storage.sh:ro]
    entrypoint: [/bin/sh, /init-storage.sh]
  storage-lifecycle-worker:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [object-storage]
    restart: unless-stopped
    command: [python, -m, invoice_intelligence.workers.storage_lifecycle]
    env_file: [.env]
    environment:
      <<: *business-db-env
      INVOICE_INTELLIGENCE_FILE_STORAGE_BACKEND: s3
      INVOICE_INTELLIGENCE_OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://object-storage:9000}
      INVOICE_INTELLIGENCE_OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_APP_ACCESS_KEY:-${MINIO_ROOT_USER:?set minio user}}
      INVOICE_INTELLIGENCE_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/object_storage_app_secret_key
    depends_on:
      postgres: {condition: service_healthy}
      migration: {condition: service_completed_successfully}
    secrets: [postgres_business_password, object_storage_app_secret_key]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}
  milvus:
    image: milvusdb/milvus:v3.0.0
    profiles: [vector]
    restart: unless-stopped
    command: [milvus, run, standalone]
    environment: {ETCD_ENDPOINTS: etcd:2379, MINIO_ADDRESS: object-storage:9000}
    depends_on: {etcd: {condition: service_healthy}, object-storage: {condition: service_healthy}}
    volumes: [milvus_data:/var/lib/milvus]
    healthcheck: {test: [CMD, curl, -f, http://127.0.0.1:9091/healthz], interval: 15s, timeout: 10s, retries: 10, start_period: 30s}
    deploy: {resources: {limits: {cpus: "4.0", memory: 4G}}}
  attu:
    image: zilliz/attu:v2.5
    profiles: [vector-dev]
    restart: unless-stopped
    environment: {MILVUS_URL: milvus:19530}
    depends_on: {milvus: {condition: service_healthy}}
    ports: ["${ATTU_PORT:-8001}:3000"]
    healthcheck: {test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:3000/ || exit 1"], interval: 15s, timeout: 5s, retries: 5}
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    profiles: [mlflow-local]
    restart: unless-stopped
    command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --backend-store-uri, sqlite:////mlflow/mlflow.db, --default-artifact-root, s3://mlflow-artifacts]
    environment: {AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?set minio user}", MLFLOW_S3_ENDPOINT_URL: http://object-storage:9000}
    secrets: [minio_root_password]
    volumes: [mlflow_data:/mlflow]
    depends_on: {object-storage: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"], interval: 15s, timeout: 5s, retries: 10}
    deploy: {resources: {limits: {cpus: "2.0", memory: 1G}}}
  evaluation-worker:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [mlops]
    restart: on-failure:3
    command: [python, -m, invoice_intelligence.workers.evaluation]
    env_file: [.env]
    environment:
      <<: *business-db-env
      INVOICE_INTELLIGENCE_EVALUATION_WORKER_ID: "${EVALUATION_WORKER_ID:?set stable worker id}"
    depends_on: {postgres: {condition: service_healthy}, migration: {condition: service_completed_successfully}}
    secrets: [postgres_business_password]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health, --worker-id-env, INVOICE_INTELLIGENCE_EVALUATION_WORKER_ID], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}}}
  scheduler:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [mlops]
    restart: unless-stopped
    command: [python, -m, invoice_intelligence.workers.scheduler]
    env_file: [.env]
    environment:
      <<: *business-db-env
      INVOICE_INTELLIGENCE_SCHEDULER_WORKER_ID: "${SCHEDULER_WORKER_ID:?set stable worker id}"
    depends_on: {postgres: {condition: service_healthy}, migration: {condition: service_completed_successfully}}
    secrets: [postgres_business_password]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health, --worker-id-env, INVOICE_INTELLIGENCE_SCHEDULER_WORKER_ID], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}
  training-worker:
    build: {context: ., dockerfile: Dockerfile}
    profiles: [mlops]
    restart: unless-stopped
    command: [python, -m, invoice_intelligence.workers.training]
    env_file: [.env]
    environment:
      <<: *business-db-env
      INVOICE_INTELLIGENCE_TRAINING_WORKER_ID: "${TRAINING_WORKER_ID:?set stable worker id}"
    depends_on: {postgres: {condition: service_healthy}, migration: {condition: service_completed_successfully}}
    secrets: [postgres_business_password]
    volumes: [./logs:/app/logs]
    healthcheck: {test: [CMD, python, -m, invoice_intelligence.workers.runtime_health, --worker-id-env, INVOICE_INTELLIGENCE_TRAINING_WORKER_ID], interval: 15s, timeout: 5s, retries: 3}
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}}}
secrets:
  postgres_business_password: {file: ./secrets/postgres_business_password.txt}
  postgres_auth_password: {file: ./secrets/postgres_auth_password.txt}
  keycloak_admin_password: {file: ./secrets/keycloak_admin_password.txt}
  minio_root_password: {file: ./secrets/minio_root_password.txt}
  object_storage_app_secret_key:
    file: ${OBJECT_STORAGE_APP_SECRET_FILE:-./secrets/minio_root_password.txt}
volumes:
  postgres_business_data:
  postgres_auth_data:
  etcd_data:
  object_storage_data:
  milvus_data:
  mlflow_data:
  invoice_documents:
