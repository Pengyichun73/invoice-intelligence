services:
  ocr:
    image: invoice-intelligence-ocr:ppocrv6-small-v1
    build:
      context: ./docker/ocr
    restart: unless-stopped
    command:
      - paddlex
      - --serve
      - --pipeline
      - /etc/invoice-intelligence/ocr.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8077"
      - --device
      - gpu:0
    environment:
      PADDLE_PDX_CACHE_HOME: /var/cache/paddlex
    volumes:
      - ./conf/ocr/ppocrv6_small_v1.yaml:/etc/invoice-intelligence/ocr.yaml:ro
      - paddlex_model_cache:/var/cache/paddlex
    gpus: all
    shm_size: 1gb
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8077/openapi.json', timeout=3)); assert '/ocr' in data['paths']"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
  extraction-worker:
    environment:
      INVOICE_INTELLIGENCE_OCR_BASE_URL: http://ocr:8077
    depends_on:
      ocr:
        condition: service_healthy

volumes:
  paddlex_model_cache:
