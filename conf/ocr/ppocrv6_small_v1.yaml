# Invoice Intelligence local OCR pipeline.
# config_version: ppocrv6-small-v1
# schema_version: PaddleX 3.7.2 / PaddleOCR 3.7.0
# detection_model_version: PP-OCRv6_small_det
# recognition_model_version: PP-OCRv6_small_rec
# deployment_device: gpu:0 (PaddleX CLI --device; not a pipeline YAML field)
pipeline_name: OCR

text_type: general

use_doc_preprocessor: false
use_textline_orientation: false

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    use_doc_orientation_classify: false
    use_doc_unwarping: false
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        model_dir: null

SubModules:
  TextDetection:
    module_name: text_detection
    model_name: PP-OCRv6_small_det
    model_dir: null
    limit_side_len: 640
    limit_type: max
    max_side_limit: 640
    thresh: 0.3
    box_thresh: 0.6
    unclip_ratio: 1.5
  TextLineOrientation:
    module_name: textline_orientation
    model_name: PP-LCNet_x1_0_textline_ori
    model_dir: null
    batch_size: 1
  TextRecognition:
    module_name: text_recognition
    model_name: PP-OCRv6_small_rec
    model_dir: null
    batch_size: 1
    score_thresh: 0.0
